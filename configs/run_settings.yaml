dataset:
  source_dataset: cais/mmlu
  source_split: test
  path: data/frozen/conversations.csv
  required_columns:
    - item_id
    - source_subject
    - source_row_idx
    - domain_pool
    - subset_label
    - claim_truth
    - correct_choice_index
    - correct_choice_text
    - user_claim_choice_index
    - user_claim_choice_letter
    - user_claim_choice_text
    - turn_2_user_text
    - followup_id
    - followup_text
    - turn_4_user_text
  subject_pools:
    BIO:
      - anatomy
      - clinical_knowledge
      - college_biology
      - college_medicine
      - medical_genetics
      - virology
      - nutrition
    OOD:
      - elementary_mathematics
      - high_school_geography
      - conceptual_physics
      - computer_security
      - college_chemistry
  subset_counts:
    BIO_P: 100
    BIO_R: 100
    OOD_P: 100
    OOD_R: 100
  sampling_seeds:
    selection_seed: 42
    subset_assignment_seed: 43
    wrong_choice_seed: 44
    pressure_assignment_seed: 45
    pilot_slice_seed: 46
  eligibility:
    question_max_chars: 2000
    turn_2_max_chars: 2600
    turn_4_max_chars: 600

models:
  mistral_7b_instruct_v0_3:
    display_name: Mistral 7B Instruct v0.3
    repo_id: mistralai/Mistral-7B-Instruct-v0.3
  biomistral_7b:
    display_name: BioMistral 7B
    repo_id: BioMistral/BioMistral-7B

generation:
  temperature: 0.0
  max_new_tokens_initial: 256
  max_new_tokens_final: 256

retry:
  max_retries_per_generation: 3

execution:
  backend_env: EIWS_RUN_BACKEND
  hub_token_env: HF_TOKEN
  supported_backends:
    - mock
    - hf_router
    - local_transformers
  local_transformers:
    device_map: auto
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_use_double_quant: true
    bnb_4bit_compute_dtype: float16
    low_cpu_mem_usage: true

run_stages:
  dry_run:
    item_counts:
      BIO_P: 1
      BIO_R: 1
      OOD_P: 1
      OOD_R: 1
    output_root: runs/dry-run
  pilot:
    item_counts:
      BIO_P: 3
      BIO_R: 3
      OOD_P: 3
      OOD_R: 3
    output_root: runs/pilot
  full:
    item_counts:
      BIO_P: 100
      BIO_R: 100
      OOD_P: 100
      OOD_R: 100
    output_root: runs/full

output:
  record_file: records.jsonl
  error_file: errors.jsonl
  summary_file: summary.json
  manifest_file: manifest.json
  messages_dir: raw/messages
  responses_dir: raw/responses
